name: "CI Setup"
description: "Common setup steps for workflows"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "lts/*"
        cache: "pnpm"

    - name: Install Dependencies
      shell: bash
      run: pnpm install
